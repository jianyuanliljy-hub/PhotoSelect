    <g fill="none" stroke="#818a81" stroke-width="1.5" stroke-linejoin="round"><rect x="1247" y="82" width="17" height="15" rx="2"/><path d="M1247 92h17m27-8v-5h5m12 0h5v5m-22 9v5h5m12 0h5v-5"/></g>
    <rect x="64" y="118" width="242" height="658" fill="#f1f3ed"/>
    <path d="M306 118v658" stroke="#dce1d8"/>
