    <circle cx="87" cy="90" r="5" fill="#e8b8ae"/><circle cx="106" cy="90" r="5" fill="#e5d19b"/><circle cx="125" cy="90" r="5" fill="#b4ccad"/>
    <path d="m171 83-7 7 7 7m24-14 7 7-7 7" fill="none" stroke="#90988f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
