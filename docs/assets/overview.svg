    <text x="340" y="158" font-size="12" fill="#d5ddd1">DSC_0144.RAW</text><path d="M459 146v13" stroke="#5d695e"/><text x="473" y="158" font-size="12" fill="#a9b5a7">24 / 240</text>
    <rect x="576" y="723" width="527" height="39" rx="9" fill="#28312b" stroke="#424c43"/>
    <g font-size="12" fill="#d4dbcf">
      <rect x="590" y="732" width="23" height="21" rx="4" fill="#3d473e"/><text x="601.5" y="747" text-anchor="middle">1</text><text x="626" y="747">Reject</text>
      <rect x="720" y="732" width="23" height="21" rx="4" fill="#3d473e"/><text x="731.5" y="747" text-anchor="middle">2</text><text x="756" y="747">Keep</text>
      <rect x="845" y="732" width="23" height="21" rx="4" fill="#3d473e"/><text x="856.5" y="747" text-anchor="middle">3</text><text x="881" y="747">Select</text>
      <rect x="977" y="732" width="23" height="21" rx="4" fill="#3d473e"/><text x="988.5" y="747" text-anchor="middle">4</text><text x="1013" y="747">Hero</text>
    </g>
    <rect x="1267" y="733" width="87" height="27" rx="13" fill="#202924" stroke="#424c43"/><text x="1310" y="751" text-anchor="middle" class="light">−   Fit   +</text>
  </g>
  <text x="72" y="825" font-size="12" fill="#6f7b6c" letter-spacing="2.2">A QUIET SPACE. A CLEAR DECISION.</text>
  <text x="1368" y="825" text-anchor="end" font-size="11" fill="#7d8979" letter-spacing="1.3">PHOTOSELECT / INTERFACE ILLUSTRATION</text>
</svg>
