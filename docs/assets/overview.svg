    <g fill="none" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="m99 318 2 6 6 2-6 2-2 6-2-6-6-2 6-2z" stroke="#8b7d9e"/><path d="m99 360 2.4 5 5.6.8-4 4 .9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-4 5.6-.8z" stroke="#b18f52"/><circle cx="99" cy="410" r="7" stroke="#718e6b"/><path d="m96 410 2 2 4-5" stroke="#718e6b"/><path d="M94 478h10l-1 11h-8zm-2-3h14m-9-3h4" stroke="#a18179"/></g>
