    <text x="116" y="194" class="label">All Photos</text>
    <rect x="78" y="211" width="214" height="38" rx="7" fill="#dfe5d9"/>
    <text x="116" y="236" font-size="15" font-weight="600" fill="#3c493d">Unreviewed</text>
    <g fill="none" stroke="#788575" stroke-width="1.5"><rect x="91" y="182" width="15" height="12" rx="2"/><path d="m92 192 5-5 4 4 4-3"/><circle cx="99" cy="229" r="7" stroke-dasharray="2 2"/></g>
    <text x="275" y="194" text-anchor="end" class="small">360</text><text x="275" y="236" text-anchor="end" font-size="12" fill="#5e6b59">240</text>
    <text x="88" y="294" class="small" font-weight="600" letter-spacing="1.5">PICKS</text>
