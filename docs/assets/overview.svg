<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc">
  <title id="title">PhotoSelect interface illustration</title>
  <desc id="desc">A native Mac culling workspace, illustrated with a synthetic mountain landscape. Sidebar filters and four keyboard decisions surround a large photo canvas. This is an illustration, not an application screenshot.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#eceee7"/><stop offset="1" stop-color="#e2e5df"/></linearGradient>
    <linearGradient id="sky" x2="0.3" y2="1"><stop stop-color="#bbc9c6"/><stop offset="0.68" stop-color="#e4dccc"/><stop offset="1" stop-color="#eae0c9"/></linearGradient>
    <linearGradient id="near" x2="0.4" y2="1"><stop stop-color="#3b5652"/><stop offset="1" stop-color="#1c3434"/></linearGradient>
    <linearGradient id="water" x2="0" y2="1"><stop stop-color="#a0b6ac"/><stop offset="1" stop-color="#496b64"/></linearGradient>
    <clipPath id="window"><rect x="64" y="62" width="1312" height="714" rx="16"/></clipPath>
    <clipPath id="photo"><rect x="376" y="156" width="936" height="560" rx="2"/></clipPath>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#28352d" flood-opacity="0.14"/></filter>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif} .label{fill:#555d57;font-size:15px}.small{fill:#828982;font-size:12px}.light{fill:#e1e6df;font-size:13px}</style>
  </defs>
  <rect width="1440" height="880" rx="24" fill="url(#paper)"/>
  <rect x="64" y="62" width="1312" height="714" rx="16" fill="#f5f6f2" filter="url(#shadow)"/>
  <g clip-path="url(#window)">
